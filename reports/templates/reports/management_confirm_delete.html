{% extends "management_base.html" %}
{% block title %}Delete {{ object_type }} — {{ ORG_NAME }}{% endblock %}
{% block breadcrumb %}Delete{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-8">
  <div class="card p-8 text-center">
    <div class="mx-auto h-14 w-14 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-2xl">⚠</div>
    <h1 class="text-xl font-bold text-mapnavy mt-4">Delete this {{ object_type }}?</h1>
    <p class="text-sm text-gray-600 mt-2">This action cannot be undone.</p>
    <div class="bg-gray-50 rounded-lg p-3 mt-4 text-[13px] text-left">
      <strong>Item:</strong> {{ object }}
    </div>
    <form method="post" class="mt-6 flex gap-3 justify-center">
      {% csrf_token %}
      <a href="{{ cancel_url }}" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary !bg-red-600 hover:!bg-red-700">Delete</button>
    </form>
  </div>
</div>
{% endblock %}
