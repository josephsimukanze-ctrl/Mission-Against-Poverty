{% extends "base.html" %}
{% block title %}Set new password — {{ ORG_NAME }}{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-mapbg p-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow">
    {% if validlink %}
      <h1 class="text-xl font-bold text-mapnavy mb-4">Set a new password</h1>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div><label class="form-label">New password</label><input class="form-input" type="password" name="new_password1" required></div>
        <div><label class="form-label">Confirm</label><input class="form-input" type="password" name="new_password2" required></div>
        <button class="btn-primary w-full justify-center">Update password</button>
      </form>
    {% else %}
      <h1 class="text-xl font-bold text-mapnavy mb-2">Invalid link</h1>
      <p class="text-sm text-gray-600">This reset link is invalid or expired. Request a new one.</p>
      <a href="{% url 'accounts:password_reset' %}" class="btn-primary mt-4 inline-flex">Request new link</a>
    {% endif %}
  </div>
</div>
{% endblock %}
